<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v={{ version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}?v={{ version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/prisma_hero.css') }}?v={{ version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/smooth_input.css') }}?v={{ version }}">

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/kd_favicon.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/kd_favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/kd_favicon.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/material-symbols/material-symbols.css') }}">
</head>

<body class="spa-shell-body">
    <!-- Prisma-Hero Cinematic Preloader & Laptop Screen Zoom-Reveal Portal -->
    <div id="prismaHeroPreloader" class="prisma-hero-container" role="dialog" aria-modal="true" aria-label="Đang tải hệ thống KDMES">
        <div class="prisma-hero-inner">
            <!-- Background Video & Poster -->
            <video
                id="prismaHeroVideo"
                autoplay
                loop
                muted
                playsinline
                poster="{{ url_for('static', filename='img/prisma_hero_poster.jpg') }}"
                class="prisma-hero-video"
            >
                <source src="{{ url_for('static', filename='video/prisma_hero.mp4') }}" type="video/mp4">
                <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260405_170732_8a9ccda6-5cff-4628-b164-059c500a2b41.mp4" type="video/mp4">
            </video>

            <!-- Noise & Gradient Overlays -->
            <div class="prisma-noise-overlay"></div>
            <div class="prisma-gradient-overlay"></div>

            <!-- Bottom-Left: 0 to 100 Counter & Status -->
            <div class="prisma-hero-counter-zone">
                <div class="prisma-counter-row">
                    <span class="prisma-counter-number" id="prismaCounterNumber">00</span>
                    <span class="prisma-counter-percent">%</span>
                </div>
                <div class="prisma-counter-status">
                    <span class="prisma-status-dot"></span>
                    <span class="prisma-status-text" id="prismaStatusText">INITIALIZING KDMES SYSTEM...</span>
                </div>
                <div class="prisma-progress-track">
                    <div class="prisma-progress-bar" id="prismaHeroProgressBar"></div>
                </div>
            </div>

            <!-- Expanding Portal Rim on Laptop Screen -->
            <div class="prisma-portal-rim" id="prismaPortalRim"></div>
        </div>
    </div>
    <!-- Execute Prisma Hero Preloader immediately on frame 0 -->
    <script src="{{ url_for('static', filename='js/prisma_hero.js') }}?v={{ version }}"></script>

    {% include "components/sidebar.html" %}

    <!-- Global Loading Toast Indicator for Preloading SPA -->
    <div id="spaPreloadBadge" class="spa-preload-badge toast-item toast-info" role="status" aria-live="polite">
        <div class="toast-icon" id="spaPreloadIconContainer">
            <div class="spa-preload-spinner" id="spaPreloadSpinner"></div>
        </div>
        <div class="toast-content">
            <div class="toast-title" id="spaPreloadTitle">Đang tải KDMES Tool...</div>
            <div class="toast-message" id="spaPreloadMessage">Đang tải các trang... (<span id="spaPreloadCounter">...</span>)</div>
        </div>
        <div class="spa-preload-progress-track">
            <div class="spa-preload-progress-bar" id="spaPreloadProgressBar"></div>
        </div>
    </div>

    <main id="spaViewport" class="spa-viewport">
        <!-- Preloaded Isolated Views (Active Route loads first, remaining 11 frames stagger-loaded in background) -->
        <iframe id="view-main" class="spa-view-frame {% if initial_path == '/main' or not initial_path %}active{% endif %}" {% if initial_path == '/main' or not initial_path %}src="{{ url_for('main', frame='1') }}"{% else %}data-src="{{ url_for('main', frame='1') }}"{% endif %} title="Main"></iframe>
        <iframe id="view-scan-barcode-history" class="spa-view-frame {% if initial_path == '/scan-barcode-history' %}active{% endif %}" {% if initial_path == '/scan-barcode-history' %}src="{{ url_for('scan_barcode_history', frame='1') }}"{% else %}data-src="{{ url_for('scan_barcode_history', frame='1') }}"{% endif %} title="Lịch sử quét tem theo Máy"></iframe>
        <iframe id="view-print-barcode-history" class="spa-view-frame {% if initial_path == '/print-barcode-history' %}active{% endif %}" {% if initial_path == '/print-barcode-history' %}src="{{ url_for('print_barcode_history', frame='1') }}"{% else %}data-src="{{ url_for('print_barcode_history', frame='1') }}"{% endif %} title="Lịch sử in tem theo Máy"></iframe>
        <iframe id="view-validate-scan-barcode" class="spa-view-frame {% if initial_path == '/validate-scan-barcode' %}active{% endif %}" {% if initial_path == '/validate-scan-barcode' %}src="{{ url_for('validate_scan_barcode', frame='1') }}"{% else %}data-src="{{ url_for('validate_scan_barcode', frame='1') }}"{% endif %} title="Kiểm tra tem đầu vào"></iframe>
        <iframe id="view-reprint" class="spa-view-frame {% if initial_path == '/reprint' %}active{% endif %}" {% if initial_path == '/reprint' %}src="{{ url_for('reprint', frame='1') }}"{% else %}data-src="{{ url_for('reprint', frame='1') }}"{% endif %} title="Truy vấn in bù"></iframe>
        <iframe id="view-substitutions" class="spa-view-frame {% if initial_path == '/substitutions' %}active{% endif %}" {% if initial_path == '/substitutions' %}src="{{ url_for('substitutions', frame='1') }}"{% else %}data-src="{{ url_for('substitutions', frame='1') }}"{% endif %} title="NVL thay thế"></iframe>
        <iframe id="view-check-qc-data" class="spa-view-frame {% if initial_path == '/check-qc-data' %}active{% endif %}" {% if initial_path == '/check-qc-data' %}src="{{ url_for('check_qc_data', frame='1') }}"{% else %}data-src="{{ url_for('check_qc_data', frame='1') }}"{% endif %} title="Check QC Data"></iframe>
        <iframe id="view-check-mesync" class="spa-view-frame {% if initial_path == '/check-mesync' %}active{% endif %}" {% if initial_path == '/check-mesync' %}src="{{ url_for('check_mesync', frame='1') }}"{% else %}data-src="{{ url_for('check_mesync', frame='1') }}"{% endif %} title="Check Mesync"></iframe>
        <iframe id="view-station-configuration" class="spa-view-frame {% if initial_path == '/station-configuration' %}active{% endif %}" {% if initial_path == '/station-configuration' %}src="{{ url_for('station_configuration', frame='1') }}"{% else %}data-src="{{ url_for('station_configuration', frame='1') }}"{% endif %} title="Thiết lập máy"></iframe>
        <iframe id="view-technical-specifications" class="spa-view-frame {% if initial_path == '/technical-specifications' %}active{% endif %}" {% if initial_path == '/technical-specifications' %}src="{{ url_for('technical_specifications', frame='1') }}"{% else %}data-src="{{ url_for('technical_specifications', frame='1') }}"{% endif %} title="Thông số kỹ thuật"></iframe>
        <iframe id="view-gitlab-deleted-files" class="spa-view-frame {% if initial_path == '/gitlab-deleted-files' %}active{% endif %}" {% if initial_path == '/gitlab-deleted-files' %}src="{{ url_for('gitlab_deleted_files', frame='1') }}"{% else %}data-src="{{ url_for('gitlab_deleted_files', frame='1') }}"{% endif %} title="Gitlab Deleted Files"></iframe>
        <iframe id="view-postgres-deleted-data" class="spa-view-frame {% if initial_path == '/postgres-deleted-data' %}active{% endif %}" {% if initial_path == '/postgres-deleted-data' %}src="{{ url_for('postgres_deleted_data', frame='1') }}"{% else %}data-src="{{ url_for('postgres_deleted_data', frame='1') }}"{% endif %} title="Postgres Deleted Data"></iframe>
        <iframe id="view-magic-winx" class="spa-view-frame {% if initial_path == '/magic-winx' %}active{% endif %}" {% if initial_path == '/magic-winx' %}src="{{ url_for('magic_winx', frame='1') }}"{% else %}data-src="{{ url_for('magic_winx', frame='1') }}"{% endif %} title="Magic Winx"></iframe>
        <iframe id="view-create-kd-account" class="spa-view-frame {% if initial_path == '/create-kd-account' %}active{% endif %}" {% if initial_path == '/create-kd-account' %}src="{{ url_for('create_kd_account', frame='1') }}"{% else %}data-src="{{ url_for('create_kd_account', frame='1') }}"{% endif %} title="Tạo Tài Khoản"></iframe>
        <iframe id="view-check-kd-account" class="spa-view-frame {% if initial_path == '/check-kd-account' %}active{% endif %}" {% if initial_path == '/check-kd-account' %}src="{{ url_for('check_kd_account', frame='1') }}"{% else %}data-src="{{ url_for('check_kd_account', frame='1') }}"{% endif %} title="Kiểm Tra Tài Khoản"></iframe>
    </main>

    {% include "components/shared_modals.html" %}

    <script>
        window.initialRoutePath = '{{ initial_path or "/main" }}';
    </script>
    <script src="{{ url_for('static', filename='js/smooth_input.js') }}?v={{ version }}"></script>
    <script src="{{ url_for('static', filename='js/sidebar.js') }}?v={{ version }}"></script>
    <script src="{{ url_for('static', filename='js/spa_shell.js') }}?v={{ version }}"></script>
</body>

</html>
