<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reprint Label Log | Nhật Ký In Lại Tem</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/google-fonts/google-fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v={{ version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/smooth_input.css') }}?v={{ version }}">

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/kd_favicon.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/kd_favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/kd_favicon.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/flatpickr/flatpickr.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/material-symbols/material-symbols.css') }}">
</head>
<body class="reprint-label-log {% if is_frame %}is-spa-frame{% endif %} app-loading-state">
    {% if not is_frame %}{% include "components/sidebar.html" %}{% endif %}

    <div class="container" autocomplete="off">
        <div class="search-section">
            <div class="search-row" style="display: flex; align-items: center; gap: 12px; width: 100%; flex-wrap: wrap;">
                <!-- 1. btnLoad -->
                <button type="button" id="btnLoad" class="winx-btn winx-btn-primary btn-refresh" style="height: 44px; padding: 0 24px; font-size: 14px; font-weight: 700; letter-spacing: 0.5px; flex-shrink: 0;" aria-label="Load dữ liệu file log">
                    <span class="material-symbols-outlined" id="btnLoadIcon" style="font-size: 20px !important;">sync</span>
                    <span>Load</span>
                </button>

                <!-- 2. locationFilter (Dropdown KV1 / KV2) -->
                <div class="input-box" style="min-width: 150px; max-width: 180px; width: 165px; flex-shrink: 0; position: relative;">
                    <input placeholder=" " type="text" id="locationFilter" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="input" style="cursor: not-allowed;" readonly disabled aria-label="Lọc theo Location">
                    <label class="user-label">Location</label>
                    <div id="location-filter-dropdown" class="dropdown-list"></div>
                </div>

                <!-- 3. dateRange (Sử dụng flatpickr) -->
                <div class="input-box" style="min-width: 240px; max-width: 280px; width: 270px; flex-shrink: 0;">
                    <input required type="text" id="dateRange" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="input" placeholder="Chọn ngày" disabled>
                    <input type="hidden" id="fromDate">
                    <input type="hidden" id="toDate">
                </div>

                <!-- 3. clientSearch (Đồng bộ kích thước 185px với page Main) -->
                <div class="input-wrapper" style="width: 185px; min-width: 130px; max-width: 185px; flex-shrink: 0;">
                    <input placeholder="Tìm kiếm..." class="input" id="clientSearch" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" type="text" aria-label="Tìm kiếm trong bảng" disabled>
                </div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-scroll">
                <!-- Standby guide / empty state before search -->
                <div class="table-standby-placeholder" id="tableStandbyPlaceholder">
                    <div class="standby-icon-ring">
                        <span class="material-symbols-outlined standby-icon">receipt_long</span>
                    </div>
                    <div class="standby-title">Sẵn sàng tra cứu nhật ký in lại tem</div>
                    <div class="standby-subtitle">Bấm nút "Load" để tải dữ liệu nhật ký in lại tem</div>
                </div>
                <table id="reprintLogTable" style="display: none;">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div class="table-footer hidden">
                <div class="table-footer-left">
                    <div class="row-count">Số dòng: <span id="rowCount">0</span></div>
                </div>
                <nav aria-label="pagination" class="pagination-nav" id="paginationNav"></nav>
                <div class="table-footer-right" style="display: flex; align-items: center; gap: 10px;">
                    <button class="btn-export-excel" id="exportExcelBtn" aria-label="Xuất dữ liệu ra file Excel">
                        <div class="btn-export-excel-wrapper">
                            <div class="text">Xuất Excel</div>
                            <span class="icon">
                                <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img" width="2em" height="2em" preserveAspectRatio="xMidYMid meet" viewBox="0 0 24 24">
                                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.878a2 2 0 0 0 1.94-1.515L22 17"></path>
                                </svg>
                            </span>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    {% include "components/shared_modals.html" %}

    <script src="{{ url_for('static', filename='vendor/flatpickr/flatpickr.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/smooth_input.js') }}?v={{ version }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}?v={{ version }}"></script>
    <script src="{{ url_for('static', filename='js/reprint_label_log.js') }}?v={{ version }}"></script>
</body>
</html>
