<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông số kỹ thuật</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v={{ version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/smooth_input.css') }}?v={{ version }}">

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/kd_favicon.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/kd_favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/kd_favicon.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/material-symbols/material-symbols.css') }}">
    <style>
        body.technical-specifications .btn-export-excel {
            display: none !important;
        }
    </style>
</head>
<body class="technical-specifications {% if is_frame %}is-spa-frame{% endif %} app-loading-state">
    {% if not is_frame %}{% include "components/sidebar.html" %}{% endif %}

    <div class="container" autocomplete="off">
        <div class="search-section">
            <div class="search-row tech-spec-type-col">
                <div class="input-box">
                    <input required placeholder=" " type="text" id="product_type" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="input">
                    <label class="user-label">Loại sản phẩm (Product Type)</label>
                    <div id="product-type-dropdown" class="dropdown-list"></div>
                </div>
            </div>
            <div class="search-row tech-spec-client-col search-row-client">
                <div class="input-wrapper">
                    <input placeholder="Tìm kiếm..." class="input" id="clientSearch" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" type="text" aria-label="Tìm kiếm trong bảng">
                </div>
            </div>
        </div>
        
        <div class="table-container">
            <div class="table-scroll">
                <table>
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div class="table-footer hidden">
                <div class="table-footer-left">
                    <div class="row-count">Số dòng: <span id="rowCount">0</span></div>
                    <div class="spec-stat-badge" id="standingTimeBadge" title="Thời gian chờ tối thiểu (min)">
                        <span class="spec-stat-label">standing-time:</span>
                        <span class="spec-stat-value" id="standingTimeVal">-</span>
                    </div>
                    <div class="spec-stat-badge" id="limitaryHourBadge" title="Hạn sử dụng theo ngày (expday từ cấu hình KD / limitary-hour)">
                        <span class="spec-stat-label">expday-kd:</span>
                        <span class="spec-stat-value" id="limitaryHourVal">-</span>
                    </div>
                    <div class="spec-stat-badge" id="expdayBadge" title="Hạn sử dụng theo ngày (expday từ SQL Server ERP 10.33)">
                        <span class="spec-stat-label">expday-kv:</span>
                        <span class="spec-stat-value" id="expdayVal">-</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    {% include "components/shared_modals.html" %}

    <script src="{{ url_for('static', filename='vendor/xlsx/xlsx.full.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/smooth_input.js') }}?v={{ version }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}?v={{ version }}"></script>
    <script src="{{ url_for('static', filename='js/technical_specifications.js') }}?v={{ version }}"></script>
</body>
</html>
